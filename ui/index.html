<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLUIDIC</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #131417; --panel2: #101113; --line: #23262c; --line-2: #2f343c;
    --text: #e7ebf1; --dim: #8a93a3; --aqua: #5fd4e6; --aqua-d: #2b8fa0; --amber: #e2a84a; --curse: #b46cf0; --red: #e5484d;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  /* the whole instrument fits the window: the drip view takes whatever height is left, the keyboard stays on screen */
  html, body { height: 100%; overflow: hidden; }
  .fluidic { width: min(1280px, 100vw); height: 100vh; height: 100dvh; padding: 12px; display: flex; flex-direction: column; gap: 10px; user-select: none; }
  .fluidic > * { flex: none; }
  .fluidic > .viz { flex: 1 0 300px; height: auto; }   /* never below 300px; takes any spare height */
  .mid { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: #2f343c transparent; }
  .mid::-webkit-scrollbar { width: 6px; } .mid::-webkit-scrollbar-thumb { background: #2f343c; border-radius: 3px; }
  .mid.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 26px), transparent); mask-image: linear-gradient(#000 calc(100% - 26px), transparent); }

  header { display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; }
  .brand b { font-size: 18px; letter-spacing: .32em; font-weight: 700; }
  .brand small { display: block; color: var(--dim); font-size: 9px; letter-spacing: .22em; margin-top: 2px; }
  .spacer { flex: 1; }
  select.preset { background: #0f1012; color: var(--text); border: 1px solid var(--line-2); border-radius: 6px; height: 30px; padding: 0 10px; font: inherit; min-width: 200px; }
  .meter { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 10px; letter-spacing: .12em; }
  .meter i { width: 90px; height: 6px; background: #1a1c20; border-radius: 3px; overflow: hidden; display: block; }
  .meter i b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--aqua), var(--amber) 70%, var(--red)); }

  .viz { position: relative; height: auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #05080b; }
  .viz canvas { width: 100%; height: 100%; display: block; }
  .viz .hud { position: absolute; left: 14px; top: 10px; font-size: 10px; letter-spacing: .18em; color: #7fb6c1; pointer-events: none; }
  .viz .hud span { color: var(--aqua); }
  .viz .view { position: absolute; right: 10px; top: 8px; display: flex; border: 1px solid #23414a; border-radius: 6px; overflow: hidden; z-index: 2; }
  .viz .view button { background: rgba(5,12,16,.7); color: #6f9aa3; border: 0; font: inherit; font-size: 10px; letter-spacing: .16em; padding: 4px 9px; cursor: pointer; }
  .viz .view button.on { background: #0f3a44; color: var(--aqua); }

  .rack { display: grid; grid-template-columns: 1fr 1.7fr 1fr 1.25fr; gap: 10px; }
  .rack .drip { grid-column: 2 / 5; }
  .rack .filter { grid-column: 1 / 3; }
  .panel.bypassed .knobs { opacity: .38; transition: opacity .2s; }
  .panel { background: linear-gradient(180deg, #17181b, #101113); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .panel h3 { margin: 0; font-size: 11px; letter-spacing: .2em; color: var(--aqua); display: flex; justify-content: space-between; align-items: center; }
  .panel h3 span { color: var(--dim); font-weight: 500; letter-spacing: .1em; font-size: 9px; }
  .knobs { display: grid; grid-auto-flow: column; grid-auto-columns: 58px; justify-content: space-evenly; gap: 6px 4px; }
  .panel > .knobs:last-child, .drip-grid .rows > .knobs:last-child, .drip-grid .rows > .krow:last-child { margin-top: auto; }
  .segs { display: grid; gap: 4px; }
  .segs button, .btn { background: #141517; border: 1px solid var(--line-2); color: var(--dim); border-radius: 6px; padding: 5px 4px; font: inherit; font-size: 10px; letter-spacing: .1em; cursor: pointer; }
  .segs button:hover, .btn:hover { color: var(--text); border-color: #46505d; }
  .segs button.on { background: var(--aqua); color: #04161a; border-color: var(--aqua); font-weight: 700; }
  .drip-grid { display: grid; grid-template-columns: 210px 1fr; gap: 14px; align-items: stretch; flex: 1; }
  .drip-grid .rows { display: flex; flex-direction: column; gap: 8px; }
  .filter .drip-grid { grid-template-columns: 262px 1fr; }
  .filter .segs button { padding: 5px 0; font-size: 9px; letter-spacing: .06em; }
  .drip-grid .rows + .rows { border-left: 1px solid var(--line); padding-left: 12px; }

  .krow { display: flex; align-items: center; gap: 6px; }
  .krow > .knobs { flex: 1; }
  .krow > i { writing-mode: vertical-rl; transform: rotate(180deg); font-style: normal; font-size: 7.5px; letter-spacing: .22em; color: #5b6470; font-weight: 600; width: 10px; text-align: center; }
  .scope { flex: 1; min-height: 34px; border: 1px solid var(--line); border-radius: 7px; background: #0b0d10; position: relative; overflow: hidden; }
  .scope canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .knob { width: 58px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: ns-resize; position: relative; touch-action: none; }
  .knob svg { width: 42px; height: 42px; overflow: visible; }
  .knob .tick { stroke: #4a525d; stroke-width: 1.4; stroke-linecap: round; }
  .knob .track { fill: none; stroke: #2a2e35; stroke-width: 3.2; stroke-linecap: round; }
  .knob .arc { fill: none; stroke: var(--aqua); stroke-width: 3.2; stroke-linecap: round; }
  .knob .cap { fill: #1d2026; stroke: #33383f; }
  .knob .needle { stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .knob .kv { font-family: var(--mono); font-size: 10px; line-height: 13px; height: 13px; color: var(--aqua); white-space: nowrap; }
  .knob .kl { font-size: 8.5px; line-height: 11px; letter-spacing: .14em; color: var(--dim); white-space: nowrap; font-weight: 600; }
  .knob:hover .cap { stroke: #56606c; }
  .knob:hover .kl { color: var(--text); }
  .knob.edge .arc { stroke: var(--amber); }
  .knob.edge .kv { color: var(--amber); }

  .keys { position: relative; height: 92px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0a0b0d; }
  .keys .w, .keys .b { position: absolute; top: 0; border-radius: 0 0 6px 6px; }
  .keys .w { height: 100%; background: linear-gradient(180deg, #dfe4ea, #f4f6f8); border: 1px solid #9aa3ad; }
  .keys .b { height: 58%; background: linear-gradient(180deg, #23262b, #111316); z-index: 2; border: 1px solid #000; }
  .keys .down.w { background: linear-gradient(180deg, #a8eef7, #e3fbfe); }
  .keys .down.b { background: linear-gradient(180deg, #2b8fa0, #164a54); }
  .keys .lbl { position: absolute; bottom: 4px; width: 100%; text-align: center; font-size: 8px; color: #6b7480; font-family: var(--mono); }
  .foot { display: flex; justify-content: space-between; color: #5f6773; font-size: 10px; letter-spacing: .06em; }

  /* dice tray */
  .dice { display: flex; align-items: stretch; gap: 10px; background: linear-gradient(180deg, #17181b, #101113); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; flex-wrap: wrap; }
  .dice h3 { margin: 0; font-size: 11px; letter-spacing: .2em; color: var(--aqua); align-self: center; width: 64px; line-height: 1.3; }
  .dice h3 small { display: block; color: var(--dim); font-size: 8px; letter-spacing: .12em; font-weight: 500; }
  .dice .set { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .die { flex: 1; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #121316; border: 1px solid var(--line-2); border-radius: 8px; padding: 5px 4px 4px; color: var(--dim); cursor: pointer; font: inherit; }
  .die svg { width: 30px; height: 30px; transition: transform .25s; }
  .die svg path, .die svg polygon { fill: #0b1b20; stroke: var(--aqua); stroke-width: 1.6; stroke-linejoin: round; }
  .die svg .in { fill: none; stroke-width: 1; opacity: .55; }
  .die b { font-size: 11px; color: var(--text); letter-spacing: .08em; }
  .die span { font-size: 8px; letter-spacing: .12em; }
  .die:hover { border-color: #46505d; color: var(--text); }
  .die:hover svg { transform: rotate(-14deg) scale(1.08); }
  .die.cursed svg path, .die.cursed svg polygon { stroke: var(--curse); fill: #1a0d22; }
  .die.cursed b { color: var(--curse); }
  .dice .locks { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .dice .locks small, .dice .hist small { color: var(--dim); font-size: 8px; letter-spacing: .14em; }
  .dice .locks div { display: flex; gap: 4px; }
  .lock { background: #141517; border: 1px solid var(--line-2); color: var(--dim); border-radius: 5px; padding: 4px 6px; font: inherit; font-size: 9px; letter-spacing: .1em; cursor: pointer; }
  .lock.on { border-color: var(--amber); color: var(--amber); background: #221a0c; }
  .dice .hist { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
  .dice .hist div { display: flex; gap: 4px; align-items: center; }
  .dice .hist button { background: #141517; border: 1px solid var(--line-2); color: var(--text); border-radius: 5px; width: 26px; height: 24px; font: inherit; cursor: pointer; }
  .dice .hist button:disabled { opacity: .3; cursor: default; }
  .dice .hist output { font-family: var(--mono); font-size: 10px; color: var(--aqua); min-width: 38px; text-align: center; }
  .panel.held h3::after { content: 'LOCKED'; color: var(--amber); font-size: 8px; letter-spacing: .16em; border: 1px solid var(--amber); border-radius: 4px; padding: 1px 4px; }
  .knob.locked .cap { stroke: var(--amber); stroke-width: 1.6; }
  .knob.locked .kl { color: var(--amber); }
  /* the roll, shown on the water */
  .roll { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 3; text-align: center; }
  .roll svg { width: 86px; height: 86px; display: block; margin: 0 auto; filter: drop-shadow(0 0 14px rgba(95,212,230,.45)); }
  .roll svg path, .roll svg polygon { fill: #0b1b20; stroke: var(--aqua); stroke-width: 1.4; stroke-linejoin: round; }
  .roll svg .in { fill: none; stroke-width: .8; opacity: .55; }
  .roll svg text { fill: #e9fbfe; font: 700 13px var(--mono); text-anchor: middle; dominant-baseline: central; opacity: 0; }
  .roll.cursed svg { filter: drop-shadow(0 0 16px rgba(180,108,240,.6)); }
  .roll.cursed svg path, .roll.cursed svg polygon { stroke: var(--curse); fill: #1a0d22; }
  .roll .say { margin-top: 6px; font-size: 10px; letter-spacing: .18em; color: #bfeff6; opacity: 0; white-space: nowrap; text-shadow: 0 0 8px #000; }
  .roll .say em { color: var(--amber); font-style: normal; }
  .roll.tumble svg { animation: tumble .75s cubic-bezier(.2,.7,.3,1) both; }
  .roll.landed svg text, .roll.landed .say { opacity: 1; transition: opacity .15s; }
  .roll.fade { opacity: 0; transition: opacity .6s; }
  .die.all svg path, .die.all svg polygon { stroke: var(--amber); fill: #1f180b; }
  .die.all b { color: var(--amber); }
  .roll.multi .row { display: flex; gap: 10px; justify-content: center; }
  .roll.multi svg { width: 58px; height: 58px; margin: 0; }
  .roll.multi .total { margin-top: 4px; font: 700 26px var(--mono); color: var(--amber); opacity: 0; text-shadow: 0 0 12px rgba(226,168,74,.5); }
  .roll.multi.landed .total { opacity: 1; transition: opacity .2s; }
  @keyframes tumble { 0% { transform: translate(-160px,-90px) rotate(-540deg) scale(.4); } 70% { transform: translate(8px,4px) rotate(18deg) scale(1.08); } 100% { transform: none; } }

  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5, 8, 11, .72); z-index: 5; cursor: pointer; }
  .start div { text-align: center; }
  .start b { display: block; font-size: 22px; letter-spacing: .4em; color: var(--aqua); }
  .start small { color: var(--dim); letter-spacing: .14em; }
  .hbtn { background: #141517; border: 1px solid var(--line-2); color: var(--text); border-radius: 6px; height: 30px; padding: 0 12px; font: inherit; font-size: 10px; letter-spacing: .14em; cursor: pointer; }
  .hbtn:hover { border-color: #46505d; }
  .hbtn.save { border-color: var(--aqua-d); color: var(--aqua); }
  .savebox { position: fixed; z-index: 20; background: #15171a; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px; width: 290px; box-shadow: 0 8px 30px #0009; display: flex; flex-direction: column; gap: 8px; }
  .savebox small { color: var(--dim); font-size: 9px; letter-spacing: .14em; }
  .savebox input { background: #0b0c0e; border: 1px solid var(--line-2); color: var(--text); border-radius: 6px; height: 30px; padding: 0 9px; font: inherit; outline: none; }
  .savebox input:focus { border-color: var(--aqua-d); }
  .savebox .row { display: flex; gap: 6px; justify-content: flex-end; }
  .savebox .note { color: var(--amber); font-size: 10px; min-height: 13px; }
  .toast { position: absolute; right: 12px; bottom: 10px; z-index: 3; font-size: 10px; letter-spacing: .16em; color: var(--aqua); background: rgba(5,12,16,.8); border: 1px solid #23414a; border-radius: 6px; padding: 5px 9px; pointer-events: none; transition: opacity .5s; }
  .ctx { position: fixed; z-index: 20; background: #15171a; border: 1px solid var(--line-2); border-radius: 8px; padding: 4px; min-width: 150px; box-shadow: 0 8px 30px #0008; }
  .ctx button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 6px 10px; font: inherit; border-radius: 5px; cursor: pointer; }
  .ctx button:hover { background: #22262c; }
  .ctx small { display: block; padding: 4px 10px 2px; color: var(--dim); font-size: 9px; letter-spacing: .1em; }

  @media (max-height: 1000px) and (min-width: 981px) {
    .fluidic, .mid { gap: 7px; }
    .fluidic { padding: 8px 12px; }
    header .brand svg { width: 28px; height: 28px; }
    .brand b { font-size: 15px; }
    .panel { padding: 7px 10px 6px; gap: 5px; }
    .knob svg { width: 36px; height: 36px; }
    .knobs { gap: 3px 4px; }
    .drip-grid .rows { gap: 4px; }
    .scope { min-height: 26px; }
    .dice { padding: 5px 10px; }
    .die { flex-direction: row; justify-content: center; gap: 7px; padding: 4px; }
    .die svg { width: 22px; height: 22px; }
    .die span { display: none; }
    .keys { height: 70px; }
    .foot { display: none; }
  }
  @media (max-height: 700px) and (min-width: 981px) {
    .knob svg { width: 32px; height: 32px; }
    .knob .kl { font-size: 8px; line-height: 10px; }
    .segs button { padding: 4px 4px; }
    .keys { height: 60px; }
  }
  @media (max-width: 980px) {
    .rack { grid-template-columns: 1fr 1fr; }
    .rack .drip, .rack .filter { grid-column: 1 / -1; }
    .rack > .panel:first-child { grid-column: 1 / -1; }
    .dice .set { flex-wrap: wrap; flex-basis: 100%; order: 2; }
    .die { flex: 1 1 88px; }
    .dice .locks, .dice .hist { flex: 1; }
    .drip-grid { grid-template-columns: 1fr; }
    .fluidic > .viz { flex-basis: 220px; }
  }
</style>
</head>
<body>
<div class="fluidic" id="fluidic"></div>

<script>
/* FLUIDIC — self-contained module. Mount it anywhere with Fluidic.mount(element).
   Every control is a parameter with a stable ID (e.g. "drip.density"): the same IDs become host-automatable
   VST3 parameters in the plugin build, and the module can later sit inside Continuum Mosaic as its own tab. */
const Fluidic = (() => {
  'use strict';
  const PATTERNS = [['even', 'EVEN'], ['rain', 'RAIN'], ['both', 'BOTH'], ['3d', '3D'], ['splash', 'SPLASH'], ['stream', 'STREAM'], ['storm', 'STORM']];
  const FTYPES = [['off', 'OFF'], ['lp', 'LP12'], ['lp24', 'LP24'], ['hp', 'HP'], ['bp', 'BP'], ['notch', 'NOTCH']];
  const WAVES = [['sine', 'SINE'], ['saw', 'SAW'], ['square', 'SQR'], ['noise', 'NOISE']];
  const pct = (v) => Math.round(v * 100);
  const hz = (v) => (v >= 1000 ? (v / 1000).toFixed(2) + 'k' : Math.round(v) + '');
  const ms = (v) => (v >= 1 ? v.toFixed(2) + 's' : Math.round(v * 1000) + 'ms');
  const signed = (v) => (v > 0 ? '+' : '') + v.toFixed(2);

  // id → spec. `eng` is the engine's name for it; `fx` marks a page-side effect parameter.
  const PARAMS = [
    { id: 'exc.wave', name: 'Wave', eng: 'wave', type: 'enum', options: WAVES, def: 'saw' },
    { id: 'exc.level', name: 'Exciter', label: 'LEVEL', eng: 'oscLevel', min: 0, max: 1, def: 0.6, fmt: pct },
    { id: 'exc.hold', name: 'Hold', label: 'HOLD', eng: 'hold', min: 0, max: 1, def: 0, fmt: pct },
    { id: 'exc.octave', name: 'Octave', label: 'OCT', eng: 'octave', min: -2, max: 2, step: 1, def: 0, fmt: (v) => (v > 0 ? '+' : '') + v },
    { id: 'drip.pattern', name: 'Pattern', eng: 'pattern', type: 'enum', options: PATTERNS, def: 'both' },
    { id: 'drip.cutoff', name: 'Drop pitch', label: 'PITCH', eng: 'cutoff', min: 80, max: 8000, log: true, def: 900, fmt: hz },
    { id: 'drip.res', name: 'Ring', label: 'RING', eng: 'res', min: 0, max: 1, def: 0.8, fmt: pct },
    { id: 'drip.key', name: 'Key track', label: 'KEY', eng: 'key', min: 0, max: 1, def: 0.6, fmt: pct },
    { id: 'drip.ping', name: 'Ping', label: 'PING', eng: 'ping', min: 0, max: 1, def: 0.85, fmt: pct },
    { id: 'drip.sweep', name: 'Sweep', label: 'SWEEP', eng: 'sweep', min: -4, max: 4, def: 2.2, fmt: signed },
    { id: 'drip.fall', name: 'Fall', label: 'FALL', eng: 'fall', min: 0.02, max: 0.4, def: 0.055, fmt: (v) => Math.round(v * 1000) + 'ms' },
    { id: 'drip.bubble', name: 'Bubble', label: 'BUBBLE', eng: 'bubble', min: 0, max: 1, def: 0.55, fmt: pct },
    { id: 'drip.wobble', name: 'Wobble', label: 'WOBBLE', eng: 'wobble', min: 0, max: 1, def: 0.4, fmt: pct },
    { id: 'drip.chirp', name: 'Chirp', label: 'CHIRP', eng: 'chirp', min: 0, max: 1, def: 0, fmt: pct },
    { id: 'drip.width', name: 'Width', label: 'WIDTH', eng: 'width', min: 0, max: 1, def: 0, fmt: (v) => pct(v) + '%' },
    { id: 'drip.density', name: 'Density', label: 'DENSITY', eng: 'density', min: 0, max: 1, def: 0.5, fmt: (v) => (Math.abs(v - 0.5) < 0.005 ? '1×' : Math.pow(2, (v - 0.5) * 4).toFixed(v > 0.5 ? 1 : 2) + '×') },
    { id: 'drip.size', name: 'Size', label: 'SIZE', eng: 'size', min: 0, max: 1, def: 0.5, fmt: (v) => Math.pow(2, (v - 0.5) * 2.4).toFixed(2) + '×' },
    { id: 'drip.edge', name: 'Edge', label: 'EDGE', eng: 'edge', min: 0, max: 1, def: 0, fmt: (v) => (v < 0.01 ? 'OFF' : pct(v)), cls: 'edge' },
    { id: 'filt.type', name: 'Filter type', eng: 'fType', type: 'enum', options: FTYPES, def: 'off' },
    { id: 'filt.cutoff', name: 'Filter cutoff', label: 'CUT', eng: 'fCut', min: 30, max: 18000, log: true, def: 2400, fmt: hz },
    { id: 'filt.res', name: 'Filter resonance', label: 'RES', eng: 'fRes', min: 0, max: 1, def: 0.25, fmt: pct },
    { id: 'filt.drive', name: 'Filter drive', label: 'DRIVE', eng: 'fDrive', min: 0, max: 1, def: 0, fmt: pct },
    { id: 'filt.env', name: 'Filter env amount', label: 'ENV', eng: 'fEnv', min: -1, max: 1, def: 0, fmt: signed },
    { id: 'filt.attack', name: 'Filter env attack', label: 'ATK', eng: 'fA', min: 0.001, max: 3, log: true, def: 0.01, fmt: ms },
    { id: 'filt.decay', name: 'Filter env decay', label: 'DEC', eng: 'fD', min: 0.02, max: 8, log: true, def: 0.6, fmt: ms },
    { id: 'filt.key', name: 'Filter key track', label: 'KEY', eng: 'fKey', min: 0, max: 1, def: 0.5, fmt: pct },
    { id: 'filt.lfoRate', name: 'Filter LFO rate', label: 'RATE', eng: 'fRate', min: 0.02, max: 8, log: true, def: 0.15, fmt: (v) => (v < 1 ? v.toFixed(2) : v.toFixed(1)) + 'Hz' },
    { id: 'filt.lfoDepth', name: 'Filter LFO depth', label: 'DEPTH', eng: 'fDepth', min: 0, max: 1, def: 0, fmt: pct },
    { id: 'amp.a', name: 'Attack', label: 'A', eng: 'a', min: 0.001, max: 2, log: true, def: 0.004, fmt: ms },
    { id: 'amp.d', name: 'Decay', label: 'D', eng: 'd', min: 0.02, max: 3, log: true, def: 0.4, fmt: ms },
    { id: 'amp.s', name: 'Sustain', label: 'S', eng: 's', min: 0, max: 1, def: 0.7, fmt: pct },

    // embedded: listen first (capture) and keep the keys from the host while FLUIDIC is showing
    const keyOpts = opts.embedded ? true : false;
    window.addEventListener('keydown', (e) => {
      if (!keysActive() || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase(), i = KEYMAP.indexOf(k);
      if (k !== 'z' && k !== 'x' && i < 0) return;
      if (opts.embedded) e.stopPropagation();
      if (e.repeat) return;
      if (k === 'z') { base = Math.max(24, base - 12); buildKeys(); return; }
      if (k === 'x') { base = Math.min(84, base + 12); buildKeys(); return; }
      noteOn(base + i, 0.85);
    }, keyOpts);
    window.addEventListener('keyup', (e) => {
      const i = KEYMAP.indexOf(e.key.toLowerCase()); if (i < 0) return;
      if (opts.embedded && keysActive()) e.stopPropagation();
      noteOff(base + i);
    }, keyOpts);
    buildKeys();
    const foot = el('div', 'foot');
    foot.innerHTML = '<span>A W S E D F T G Y H U J K play · Z / X octave · MIDI keyboards work too</span><span>drag a dial · Shift for fine · double-click resets · right-click for options</span>';
    root.append(foot);

    /* ---------------- user bank ----------------
       Saved sounds live in this browser (localStorage) and can be exported/imported as a .json bank file.
       Each sound is stored by parameter ID, the same IDs the plugin build will use. */
    const BANK_KEY = 'fluidic-user-bank-v1';
    let bank = {};
    if (!plugin) { try { bank = JSON.parse(localStorage.getItem(BANK_KEY) || '{}') || {}; } catch (e) { bank = {}; } }
    let bankStored = true;
    function storeBank() {
      if (plugin) { plugin.saveBank(JSON.stringify(bank)); bankStored = true; return; }   // %APPDATA%\FLUIDIC\user-bank.json
      try { localStorage.setItem(BANK_KEY, JSON.stringify(bank)); bankStored = true; } catch (e) { bankStored = false; }
    }
    function importBankText(text) {
      try {
        const data = JSON.parse(text), sounds = data && (data.sounds || data);
        let added = 0;
        Object.keys(sounds || {}).forEach((k) => { if (sounds[k] && sounds[k].values) { bank[k] = sounds[k]; added++; } });
        storeBank(); fillPresets(); toast('IMPORTED ' + added + (added === 1 ? ' SOUND' : ' SOUNDS'));
      } catch (err) { toast('THAT FILE IS NOT A FLUIDIC BANK'); }
    }
    let current = 'f:Init Drop', lastRoll = '';
    function fillPresets() {
      presetSel.innerHTML = '';
      const gf = el('optgroup'); gf.label = 'FACTORY';
      Object.keys(PRESETS).forEach((name) => { const o = el('option', '', name); o.value = 'f:' + name; gf.append(o); });
      presetSel.append(gf);
      const names = Object.keys(bank).sort((a, b) => a.localeCompare(b));
      if (names.length) {
        const gu = el('optgroup'); gu.label = 'USER';
        names.forEach((name) => { const o = el('option', '', name); o.value = 'u:' + name; gu.append(o); });
        presetSel.append(gu);
      }
      presetSel.value = current; if (presetSel.value !== current) presetSel.selectedIndex = 0;
    }
    function applyValues(src) {
      PARAMS.forEach((p) => { const v = src[p.id]; values[p.id] = v == null ? p.def : p.type === 'enum' ? (p.options.some((o) => o[0] === v) ? v : p.def) : Math.min(p.max, Math.max(p.min, Number(v))); });
      widgets.forEach((w) => w.paint()); sendParams(); applyFx(); commit(); presetSel.value = current;
    }
    function loadUser(name) { if (!bank[name]) return; current = 'u:' + name; applyValues(bank[name].values); persistUi(); }
    function toast(text) {
      const t = el('div', 'toast', text); vizBox.append(t);
      setTimeout(() => { t.style.opacity = '0'; }, 1800); setTimeout(() => t.remove(), 2400);
    }
    function suggestName() {
      const pat = (PATTERNS.find((x) => x[0] === values['drip.pattern']) || ['', 'Drip'])[1];
      const base = pat.charAt(0) + pat.slice(1).toLowerCase() + (lastRoll ? ' · ' + lastRoll : ' · edit');
      let n = 1, name = base; while (bank[name]) name = base + ' ' + (++n);
      return name;
    }
    let saveBox = null;
    function closeSave() { if (saveBox) { saveBox.remove(); saveBox = null; } }
    document.addEventListener('pointerdown', (e) => { if (saveBox && !saveBox.contains(e.target) && e.target !== saveBtn) closeSave(); });
    saveBtn.addEventListener('click', () => {
      if (saveBox) return closeSave();
      closeMenu();
      const r = saveBtn.getBoundingClientRect();
      saveBox = el('div', 'savebox'); saveBox.style.top = (r.bottom + 6) + 'px'; saveBox.style.left = Math.max(8, r.right - 290) + 'px';
      const inp = el('input'); inp.value = current.startsWith('u:') ? current.slice(2) : suggestName(); inp.maxLength = 40; inp.spellcheck = false;
      const note = el('div', 'note'), row = el('div', 'row'), ok = el('button', 'hbtn save', 'SAVE'), cancel = el('button', 'hbtn', 'CANCEL');
      const check = () => {
        const n = inp.value.trim();
        if (!n) { note.textContent = 'Give it a name'; ok.disabled = true; return; }
        ok.disabled = false;
        if (PRESETS[n]) note.textContent = 'That is a factory name — it will be saved as "' + n + ' (user)"';
        else note.textContent = bank[n] ? 'Replaces your saved "' + n + '"' : '';
        ok.textContent = bank[PRESETS[n] ? n + ' (user)' : n] ? 'REPLACE' : 'SAVE';
      };
      const doSave = () => {
        let n = inp.value.trim(); if (!n) return; if (PRESETS[n]) n += ' (user)';
        bank[n] = { values: Object.assign({}, values), saved: new Date().toISOString(), from: lastRoll || 'edit' };
        storeBank(); current = 'u:' + n; fillPresets(); closeSave(); persistUi();
        toast(bankStored ? 'SAVED TO BANK · ' + n.toUpperCase() : 'SAVED FOR THIS SESSION · EXPORT THE BANK TO KEEP IT');
      };
      inp.addEventListener('input', check);
      inp.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') doSave(); if (e.key === 'Escape') closeSave(); });
      inp.addEventListener('keyup', (e) => e.stopPropagation());
      ok.addEventListener('click', doSave); cancel.addEventListener('click', closeSave);
      row.append(cancel, ok);
      saveBox.append(el('small', '', 'SAVE TO BANK'), inp, note, row);
      root.append(saveBox); check(); inp.focus(); inp.select();
    });
    bankBtn.addEventListener('click', (e) => {
      closeMenu(); closeSave();
      const r = bankBtn.getBoundingClientRect();
      menu = el('div', 'ctx'); menu.style.top = (r.bottom + 6) + 'px'; menu.style.left = Math.max(8, r.right - 200) + 'px'; menu.style.minWidth = '200px';
      const item = (label, fn) => { const b = el('button', '', label); b.addEventListener('click', () => { closeMenu(); fn(); }); menu.append(b); };
      const n = Object.keys(bank).length;
      menu.append(el('small', '', 'USER BANK · ' + n + (n === 1 ? ' SOUND' : ' SOUNDS')));
      if (current.startsWith('u:')) {
        const name = current.slice(2);
        item('Delete "' + name + '"', () => { delete bank[name]; storeBank(); current = 'f:Init Drop'; fillPresets(); persistUi(); toast('DELETED · ' + name.toUpperCase()); });
      }
      item('Export bank (.json)', () => {
        if (plugin) return plugin.exportBank(JSON.stringify({ format: 'fluidic-bank', version: 1, sounds: bank }, null, 2));
        const blob = new Blob([JSON.stringify({ format: 'fluidic-bank', version: 1, sounds: bank }, null, 2)], { type: 'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'fluidic-bank.json'; document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      });
      item('Import bank (.json)…', () => {
        if (plugin) return plugin.importBank();
        const f = el('input'); f.type = 'file'; f.accept = '.json,application/json';
        f.addEventListener('change', async () => importBankText(await f.files[0].text()));
        f.click();
      });
      root.append(menu);
    });
    fillPresets();

    function loadPreset(name) {
      current = 'f:' + name;
      const pr = PRESETS[name] || {};
      PARAMS.forEach((p) => { values[p.id] = pr[p.id] != null ? pr[p.id] : p.def; });
      widgets.forEach((w) => w.paint()); sendParams(); applyFx();
      commit(); presetSel.value = current; persistUi();
    }

    /* ---------------- visualiser ---------------- */
    const g = canvas.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = vizBox.clientWidth; H = vizBox.clientHeight; canvas.width = W * DPR; canvas.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
    window.addEventListener('resize', resize); resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(vizBox);
    const KIND_HUE = { note: 188, rain: 192, splash: 172, stream: 204 };
    function spawn(ev, now) {
      const x = ev.x * W, size = Math.min(1.5, ev.size), hue = (KIND_HUE[ev.kind] || 190) - (ev.note - 60) * 0.6 + ev.chirp * 10;
      const y = H * (0.14 + 0.72 * Math.random());
      viz.drops.push({ x, y, t0: now, size, hue });
      const rings = ev.kind === 'stream' ? 1 : size > 0.7 ? 3 : 2;
      for (let r = 0; r < rings; r++) viz.ripples.push({ x, y, t0: now + 40 + r * 110, size, hue, speed: 40 + 70 * (1.1 - Math.min(1, size)) + ev.sweep * 8 });
      const sparks = Math.round(2 + size * 7 + (ev.kind === 'splash' ? 4 : 0));
      for (let s = 0; s < sparks; s++) viz.sparks.push({ x, y: 0, ox: x, oy: y, ang: Math.random() * Math.PI * 2, dist: 10 + Math.random() * (14 + size * 34), vx: (Math.random() - 0.5) * (40 + size * 120), vy: -(60 + Math.random() * 160 * (0.4 + size)), t0: now + 40, hue, r: 0.8 + Math.random() * 1.6 * size });
      if (viz.ripples.length > 260) viz.ripples.splice(0, viz.ripples.length - 260);
      if (viz.sparks.length > 600) viz.sparks.splice(0, viz.sparks.length - 600);
      if (viz.drops.length > 120) viz.drops.splice(0, viz.drops.length - 120);
    }

    // overhead view: looking straight down on the water
    function drawTop(now, dt) {
      const heat = Math.min(1, Math.max(0, (viz.peak - 0.8) / 2.2));
      const glowHue = 188 - heat * 160;
      const bg = g.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * 0.75);
      bg.addColorStop(0, `hsl(${glowHue},55%,${9 + heat * 8}%)`); bg.addColorStop(1, '#02070a');
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      // slow caustic shimmer on the surface
      g.lineWidth = 1;
      for (let i = 0; i < 7; i++) {
        g.beginPath();
        for (let x = 0; x <= W; x += 10) { const yy = H * (i + 0.5) / 7 + Math.sin(x * 0.011 + idle * 0.6 + i) * 9 + Math.sin(x * 0.027 - idle * 0.4 + i * 2) * 4; x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy); }
        g.strokeStyle = `hsla(${glowHue},70%,55%,${0.05 + heat * 0.05})`; g.stroke();
      }
      // ripples: full circles spreading out from each impact
      viz.ripples = viz.ripples.filter((r) => (now - r.t0) / 1000 < 1.8);
      for (const r of viz.ripples) {
        const age = (now - r.t0) / 1000; if (age < 0) continue;
        const rad = 3 + age * r.speed * (1 + r.size) * 0.62, a = Math.max(0, 1 - age / 1.5) * (0.35 + 0.5 * Math.min(1, r.size));
        g.beginPath(); g.arc(r.x, r.y, rad, 0, Math.PI * 2);
        g.strokeStyle = `hsla(${r.hue},80%,72%,${a})`; g.lineWidth = 1 + r.size * 1.4; g.stroke();
        g.beginPath(); g.arc(r.x, r.y, rad * 0.86, 0, Math.PI * 2);
        g.strokeStyle = `hsla(${r.hue},70%,40%,${a * 0.5})`; g.lineWidth = 1; g.stroke();
      }
      // falling drops: seen from above they grow as they approach, then flash on impact
      viz.drops = viz.drops.filter((d) => now - d.t0 < 260);
      for (const d of viz.drops) {
        const age = (now - d.t0) / 260, r0 = 2 + d.size * 5;
        const halo = g.createRadialGradient(d.x, d.y, 0, d.x, d.y, r0 * 4);
        halo.addColorStop(0, `hsla(${d.hue},90%,85%,${0.55 * (1 - age)})`); halo.addColorStop(1, `hsla(${d.hue},90%,60%,0)`);
        g.fillStyle = halo; g.beginPath(); g.arc(d.x, d.y, r0 * 4, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(d.x, d.y, r0 * (1 - age * 0.7), 0, Math.PI * 2); g.fillStyle = `hsla(${d.hue},90%,92%,${1 - age})`; g.fill();
      }
      // splash droplets thrown outwards, landing in a ring
      viz.sparks = viz.sparks.filter((s) => now < s.t0 || now - s.t0 < 600);
      for (const s of viz.sparks) {
        if (now < s.t0) continue;
        const t = (now - s.t0) / 600, d = s.dist * (1 - (1 - t) * (1 - t));
        const lift = Math.sin(t * Math.PI);
        g.beginPath(); g.arc(s.ox + Math.cos(s.ang) * d, s.oy + Math.sin(s.ang) * d, s.r * (0.6 + lift * 0.8), 0, Math.PI * 2);
        g.fillStyle = `hsla(${s.hue},90%,82%,${0.9 * (1 - t)})`; g.fill();
      }
    }
    let last = performance.now(), idle = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; idle += dt;
      const surf = H * 0.66;
      g.clearRect(0, 0, W, H);
      if (vizView === 'top') drawTop(now, dt); else {
      const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#04070a'); bg.addColorStop(0.62, '#071118'); bg.addColorStop(1, '#03161c');
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      // EDGE glow: the surface heats from aqua through amber towards red as the drops approach overload
      const heat = Math.min(1, Math.max(0, (viz.peak - 0.8) / 2.2));
      const glowHue = 188 - heat * 160;
      // water body
      const water = g.createLinearGradient(0, surf, 0, H); water.addColorStop(0, `hsla(${glowHue},70%,${18 + heat * 10}%,0.55)`); water.addColorStop(1, 'rgba(2,10,14,0.9)');
      g.fillStyle = water; g.fillRect(0, surf, W, H - surf);
      // surface line, disturbed by live ripples
      g.beginPath();
      for (let x = 0; x <= W; x += 6) {
        let y = surf + Math.sin(x * 0.012 + idle * 1.3) * 1.2 + Math.sin(x * 0.031 - idle * 0.9) * 0.6;
        for (const r of viz.ripples) { const age = (now - r.t0) / 1000; if (age < 0 || age > 1.6) continue; const rad = age * r.speed * (1 + r.size); const d = Math.abs(x - r.x) - rad; if (Math.abs(d) < 18) y += Math.cos(d / 18 * Math.PI) * 3.2 * r.size * (1 - age / 1.6); }
        x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.strokeStyle = `hsla(${glowHue},85%,${62 + heat * 8}%,${0.55 + heat * 0.35})`; g.lineWidth = 1.4 + heat * 1.6;
      g.shadowColor = `hsla(${glowHue},90%,60%,${0.4 + heat * 0.5})`; g.shadowBlur = 8 + heat * 22; g.stroke(); g.shadowBlur = 0;
      // ripples: perspective rings on the surface
      viz.ripples = viz.ripples.filter((r) => (now - r.t0) / 1000 < 1.8);
      for (const r of viz.ripples) {
        const age = (now - r.t0) / 1000; if (age < 0) continue;
        const rad = age * r.speed * (1 + r.size), a = Math.max(0, 1 - age / 1.8) * (0.35 + 0.5 * Math.min(1, r.size));
        g.beginPath(); g.ellipse(r.x, surf + 3, rad, rad * 0.2, 0, 0, Math.PI * 2);
        g.strokeStyle = `hsla(${r.hue},80%,72%,${a})`; g.lineWidth = 1 + r.size * 1.2; g.stroke();
      }
      // falling streaks: each drop is drawn landing as it sounds
      viz.drops = viz.drops.filter((d) => now - d.t0 < 260);
      for (const d of viz.drops) {
        const age = (now - d.t0) / 260, len = 30 + d.size * 70, top = surf - len * (1 - age * 0.6);
        const grad = g.createLinearGradient(0, top, 0, surf); grad.addColorStop(0, `hsla(${d.hue},90%,80%,0)`); grad.addColorStop(1, `hsla(${d.hue},90%,85%,${0.9 * (1 - age)})`);
        g.strokeStyle = grad; g.lineWidth = 1.2 + d.size * 2.4; g.beginPath(); g.moveTo(d.x, top); g.lineTo(d.x, surf); g.stroke();
        g.beginPath(); g.arc(d.x, surf - 2, (2 + d.size * 4) * (1 - age), 0, Math.PI * 2); g.fillStyle = `hsla(${d.hue},90%,88%,${1 - age})`; g.fill();
      }
      // splash sparks: little droplets thrown up that fall back in
      viz.sparks = viz.sparks.filter((s) => s.y <= 4 || now < s.t0);
      for (const s of viz.sparks) {
        if (now < s.t0) continue;
        s.vy += 520 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
        g.beginPath(); g.arc(s.x, surf + s.y, s.r, 0, Math.PI * 2); g.fillStyle = `hsla(${s.hue},90%,80%,0.85)`; g.fill();
      }
      }
      // emergency cut: a brief red flash
      if (viz.cut > 0) { g.fillStyle = `rgba(229,72,77,${viz.cut * 0.28})`; g.fillRect(0, 0, W, H); viz.cut = Math.max(0, viz.cut - dt * 3); }
      hud.innerHTML = 'PATTERN <span>' + (PATTERNS.find((p) => p[0] === values['drip.pattern']) || ['', ''])[1] + '</span> &nbsp;·&nbsp; EDGE <span>' + (values['drip.edge'] < 0.01 ? 'OFF' : pct(values['drip.edge'])) + '</span>';
      meter.querySelector('b').style.width = Math.min(100, viz.peak / 3 * 100) + '%';
      meter.querySelector('.vc').textContent = viz.voices + (viz.voices === 1 ? ' VOICE' : ' VOICES');
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    if (!plugin) loadPreset('Sine Meditation');   // FLUIDIC opens on the sine pad
    else {
      // the plugin owns the sound: take its values (a new instance starts on Sine Meditation; a project brings its own)
      const fromHost = (m) => {
        try { bank = JSON.parse(m.bank || '{}') || {}; } catch (e) { bank = {}; }
        let ui = {}; try { ui = JSON.parse(m.ui || '{}') || {}; } catch (e) {}
        PARAMS.forEach((p) => { if (m.values && m.values[p.id] != null) values[p.id] = m.values[p.id]; });
        hostVals = Object.assign({}, values);
        current = ui.preset || 'f:Sine Meditation';
        if (ui.view === 'side' || ui.view === 'top') { vizView = ui.view; viewBtns.forEach((x) => x.classList.toggle('on', x.dataset.v === vizView)); }
        fillPresets(); widgets.forEach((w) => w.paint());
        history = []; hp = -1; commit();
      };
      plugin.on('init', fromHost);
      plugin.on('restored', fromHost);
      plugin.on('params', (m) => {   // host automation and parameter changes
        Object.keys(m).forEach((id) => { if (BY_ID[id]) { values[id] = m[id]; if (hostVals) hostVals[id] = m[id]; } });
        widgets.forEach((w) => { if (w.id in m) w.paint(); });
      });
      plugin.on('bankImported', (m) => importBankText(m.json));
      start();
      plugin.ready();
    }
    return { params: PARAMS, get: (id) => values[id], set, noteOn, noteOff, trigger, loadPreset, loadUser, bank: () => bank, start, ready: () => !!node, panic: () => { held.clear(); paintKeys(); if (node) node.port.postMessage({ type: 'panic' }); },
      // the host closed its audio (e.g. Foldspace's panic): drop ours, rebuild on the next start()
      reset: () => { held.clear(); paintKeys(); try { if (node) node.disconnect(); } catch (e) {} node = null; fx = null; ctx = null; starting = null; viz.peak = 0; viz.voices = 0; if (!startOverlay.isConnected) vizBox.append(startOverlay); } };
  }
  return { mount, PARAMS, PRESETS };
})();

// Inside the FLUIDIC plugin the page runs in JUCE's web view, which provides window.__JUCE__.backend.
function juceBridge() {
  const J = window.__JUCE__ && window.__JUCE__.backend;
  if (!J || typeof J.emitEvent !== 'function') return null;
  const emit = (e, o) => J.emitEvent(e, o || {});
  return {
    param: (id, value, phase) => emit('param', { id, value, phase }),
    note: (note, vel, on) => emit('note', { note, vel, on }),
    panic: () => emit('panic'),
    saveUi: (state) => emit('ui', { state }),
    saveBank: (json) => emit('bankSave', { json }),
    exportBank: (json) => emit('bankExport', { json }),
    importBank: () => emit('bankImport'),
    on: (ev, fn) => J.addEventListener(ev, fn),
    ready: () => emit('ready')
  };
}
const fluidicBridge = juceBridge();
if (fluidicBridge) document.documentElement.classList.add('in-plugin');
window.fluidic = Fluidic.mount(document.getElementById('fluidic'), fluidicBridge ? { plugin: fluidicBridge } : {});
</script>
</body>
</html>
